name: amaseganlo
description: "Amaseganlo - Amharisch lernen"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  go_router: ^15.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.2
  audioplayers: ^6.1.0
  collection: ^1.19.0
  uuid: ^4.5.1
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/content/
    - assets/audio/
    - assets/fonts/
    - assets/icon/

  # The NotoSansEthiopic font family is registered in Etappe 4a once the
  # actual .ttf files are in assets/fonts/ - see ENTSCHEIDUNGEN.md. Until
  # then, Ethiopic text falls back to the system font.

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#0F7A3D"
