name: habesha_speak
description: "Habesha Speak - Amharisch lernen"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  go_router: ^15.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  flutter_tts: ^4.2.2
  audioplayers: ^6.1.0
  collection: ^1.19.0
  uuid: ^4.5.1
  file_selector: ^1.0.3
  in_app_purchase: ^3.2.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/content/
    - assets/audio/
    - assets/audio/words/
    - assets/fonts/

  # assets/icon/ wird erst ergänzt, sobald eine echte Icon-Datei dort liegt
  # (siehe ENTSCHEIDUNGEN.md Etappe 11) - ein deklarierter, aber leerer
  # Asset-Ordner erzeugt sonst eine flutter-analyze-Warnung.
  # Verzeichnis-Einträge in Flutters Assets sind NICHT rekursiv - jede
  # Unterordner-Ebene muss einzeln aufgeführt werden. "assets/audio/"
  # allein deckt nur manifest.json direkt darin ab, nicht die ~1057
  # echten Aufnahmen in assets/audio/words/ (siehe ENTSCHEIDUNGEN.md
  # Etappe 21 - genau das fehlte hier bisher und war der eigentliche Grund
  # für "kein Ton" auf echten Geräten, seit die Dateien in Etappe 15/16
  # angelegt wurden).

  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#0F7A3D"
