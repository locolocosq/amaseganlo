name: habesha_speak
description: "Habesha Speak - Amharisch lernen"
publish_to: 'none'

version: 1.4.1+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.0.0
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  go_router: ^15.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  flutter_tts: ^4.2.2
  audioplayers: ^6.1.0
  collection: ^1.19.0
  uuid: ^4.5.1
  file_selector: ^1.0.3
  share_plus: ^12.0.0
  in_app_purchase: ^3.2.2
  crypto: ^3.0.3
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.8
  plugin_platform_interface: ^2.1.8
  share_plus_platform_interface: ^6.1.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/content/
    - assets/audio/
    - assets/audio/words/
    - assets/fonts/

  # assets/icon/ wird erst ergänzt, sobald eine echte Icon-Datei dort liegt
  # (siehe ENTSCHEIDUNGEN.md Etappe 11) - ein deklarierter, aber leerer
  # Asset-Ordner erzeugt sonst eine flutter-analyze-Warnung.
  # Verzeichnis-Einträge in Flutters Assets sind NICHT rekursiv - jede
  # Unterordner-Ebene muss einzeln aufgeführt werden. "assets/audio/"
  # allein deckt nur manifest.json direkt darin ab, nicht die ~1057
  # echten Aufnahmen in assets/audio/words/ (siehe ENTSCHEIDUNGEN.md
  # Etappe 21 - genau das fehlte hier bisher und war der eigentliche Grund
  # für "kein Ton" auf echten Geräten, seit die Dateien in Etappe 15/16
  # angelegt wurden).

  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#0F7A3D"

# Etappe 24: replaces Flutter's default blank white splash screen. Source
# image is generated by hand (tool/generate_splash_test.dart, same
# no-downloaded-assets approach as the app icon) - re-run
# `dart run flutter_native_splash:create` after regenerating that PNG.
#
# Etappe 24 Nachtrag: switched from `background_image` to `image` - the
# `background_image` key turned out to always render via a fixed
# `android:gravity="fill"` regardless of any `android_gravity` setting
# (confirmed by inspecting the generated launch_background.xml - it never
# changed no matter what was configured), i.e. that mode always stretches
# non-uniformly to match the device's exact width AND height, distorting
# the image on any screen whose aspect ratio isn't extremely close to the
# source's own (1170x2532). `image` (+ a matching `color` fallback for any
# sliver `android_gravity` doesn't cover) DOES honour `android_gravity`/
# `ios_content_mode` - "fill|clip_vertical"/"scaleAspectFill" scale
# uniformly (no distortion) and crop the overflow instead, i.e. real
# "cover" behaviour rather than "stretch to fill". The image's own generous
# empty top/bottom margin (see tool/generate_splash_test.dart) is exactly
# what gets safely cropped on a shorter/taller screen; the title/map/taxi
# in the vertical centre are never at risk.
flutter_native_splash:
  color: "#040F09"
  image: "assets/splash/splash_background.png"
  fullscreen: true
  android_gravity: "fill|clip_vertical"
  ios_content_mode: "scaleAspectFill"
  android_12:
    # Android 12+ ignores background_image entirely (platform limitation,
    # not something this config can work around) - it only ever shows a
    # flat background colour plus a centered icon in a circle, so it gets
    # the app icon (the driver's face, already designed to read well at
    # small/cropped sizes) on a colour matching the splash's own dark
    # vignette edge instead.
    image: "assets/icon/app_icon.png"
    icon_background_color: "#040F09"
