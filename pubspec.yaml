name: amaseganlo
description: "Amaseganlo - Amharisch lernen"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  go_router: ^15.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.2
  audioplayers: ^6.1.0
  collection: ^1.19.0
  uuid: ^4.5.1
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/content/
    - assets/audio/

  # assets/fonts/ und assets/icon/ werden erst in den Etappen ergänzt, die
  # tatsächliche Dateien dort ablegen (Fidel-Font, App-Icon) - siehe
  # ENTSCHEIDUNGEN.md. Ein deklarierter, aber leerer/nicht existierender
  # Asset-Ordner erzeugt sonst eine flutter-analyze-Warnung.
  # assets/audio/ enthält bisher nur manifest.json (noch ohne echte
  # Audiodateien, siehe ENTSCHEIDUNGEN.md Etappe 7) - der Ordner selbst
  # existiert also und darf deklariert werden.

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#0F7A3D"
